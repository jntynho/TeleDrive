name: Release APK

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      publish:
        description: 'Create a GitHub release with the APK'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-nosecrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate application identity without exposing values
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re
          errors = []
          api_id = os.environ.get('TELEGRAM_API_ID', '').strip()
          api_hash = os.environ.get('TELEGRAM_API_HASH', '').strip()
          if not api_id:
              errors.append('TELEGRAM_API_ID is missing or empty. Add it under repository Settings > Secrets and variables > Actions > Repository secrets.')
          elif not re.fullmatch(r'[1-9][0-9]*', api_id) or len(api_id) > 10 or int(api_id) > 2147483647:
              errors.append('TELEGRAM_API_ID must contain only the positive numeric API ID, without quotes or a variable name.')
          if not api_hash:
              errors.append('TELEGRAM_API_HASH is missing or empty. Add it under repository Settings > Secrets and variables > Actions > Repository secrets.')
          elif not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              errors.append('TELEGRAM_API_HASH must contain exactly the 32 hexadecimal characters from my.telegram.org, without quotes or a variable name.')
          for error in errors:
              print('::error::' + error)
          if errors:
              raise SystemExit(1)
          print('Application identity configured. Values are never logged; debug tests exclude production credentials.')
          PY

  device-tests:
    needs: validate-config
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test optional sharing service
        run: npm test --prefix sharing-server
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native device smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 600
          cores: 2
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on
          script: bash scripts/run_device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  build:
    needs: validate-config
    outputs:
      signer_sha256: ${{ steps.signer.outputs.sha256 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      INPUT_VERSION: ${{ inputs.version }}
      KS_PASS: tgdrive-next-sideload-key
      APP_VERSION_CODE: ${{ github.run_number }}
      NEXT_RELEASE_KEYSTORE_BASE64: ${{ secrets.NEXT_RELEASE_KEYSTORE_BASE64 }}
      NEXT_RELEASE_STORE_PASSWORD: ${{ secrets.NEXT_RELEASE_STORE_PASSWORD }}
      NEXT_RELEASE_KEY_ALIAS: ${{ secrets.NEXT_RELEASE_KEY_ALIAS }}
      NEXT_RELEASE_KEY_PASSWORD: ${{ secrets.NEXT_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-1.0.0}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid version: $version"; exit 1; }
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"

      - name: Restore Next signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/.tgdrive-signing-next
          key: tgdrive-next-signing-key-v1

      - name: Configure independent Next signing identity
        id: signer
        run: bash scripts/configure_next_signing.sh

      - name: Persist initialized Next key
        if: steps.keycache.outputs.cache-hit != 'true' && env.NEXT_RELEASE_KEYSTORE_BASE64 == ''
        uses: actions/cache/save@v4
        with:
          path: ~/.tgdrive-signing-next
          key: tgdrive-next-signing-key-v1

      - name: Pin the new public certificate
        if: steps.signer.outputs.new_identity == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/next-cert-sha256.txt
          git commit -m 'Pin TG Drive Next signing certificate [skip ci]'
          git push origin HEAD:main

      - name: Test library recovery, lint and build two ARM release APKs
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          bash scripts/run_release_checks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/design-previews/
            shared/build/reports/tests/
            shared/build/test-results/
            app/build/outputs/mapping/release/mapping.txt

      - name: Verify size budget and packaged native libraries
        run: python3 scripts/check_apk_size.py

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$tools/zipalign" -c -P 16 4 "$apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")"
            expected="$(tr -d '\r\n ' < scripts/next-cert-sha256.txt)"
            [[ "$actual" == "$expected" ]] || { echo 'Next signing certificate changed; refusing an incompatible update.'; exit 1; }
          done
          python3 scripts/check_native_alignment.py app/build/outputs/apk/release/*.apk

      - name: Verify variants and collect separate downloads
        run: python3 scripts/collect_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: tg-drive-arm64-v8a
          path: dist/tg-drive-arm64-v8a/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: tg-drive-armeabi-v7a
          path: dist/tg-drive-armeabi-v7a/
          if-no-files-found: error
          retention-days: 30


  package-check:
    needs: build
    env:
      EXPECTED_CERT_SHA256: ${{ needs.build.outputs.signer_sha256 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - uses: actions/download-artifact@v4
        with:
          pattern: tg-drive-*
          path: release-check
      - name: Verify both signed ARM package manifests
        run: bash scripts/check_release_packages.sh

  publish:
    needs: [device-tests, build, package-check]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tg-drive-*
          path: dist
      - name: Publish installable APKs to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          filename="$(basename dist/tg-drive-arm64-v8a/*.apk)"
          version="${filename#tg-drive-}"
          version="${version%-arm64-v8a.apk}"
          mkdir release-assets
          # Stable public names keep README latest/download links valid across versions.
          # Internal Actions artifacts retain versioned names for build provenance.
          for abi in arm64-v8a armeabi-v7a; do
            apks=(dist/tg-drive-"$abi"/*.apk)
            [[ ${#apks[@]} -eq 1 && -f "${apks[0]}" ]]
            cp "${apks[0]}" "release-assets/tg-drive-$abi.apk"
          done
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            target_args=(--verify-tag)
          else
            target_args=(--target "$GITHUB_SHA")
            # Every main build gets immutable assets, even without a version bump.
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then tag="v$version-build.$GITHUB_RUN_NUMBER"; fi
          fi
          cat > release-notes.md <<'NOTES'
          Download exactly one standalone APK directly from **Assets**. No ZIP extraction is needed.

          - **tg-drive-arm64-v8a.apk**: most modern Android phones.
          - **tg-drive-armeabi-v7a.apk**: older ARM32 phones.

          This release improves navigation and UI stability across the library, gallery, audio, settings and media viewers. Rapid tab requests wait for a ready destination instead of being silently dropped; stale and duplicate navigation is rejected. Bottom insets and mini-player motion are steadier, search focus waits for the screen, gallery pinch preserves its active anchor, public-file protection checks no longer recreate viewers on every lock epoch, and private content remains fail-closed. Audio lyrics follow the current track, artwork cache keys are shared, Activity order stays fixed during progress, video seeking has one buffered/active/thumb geometry, and video activation waits for the entering screen. Sign-in drafts remain in memory only and are cleared on success. Startup preparation records its bounded deadline honestly.

          Only **tg-drive-arm64-v8a.apk** and **tg-drive-armeabi-v7a.apk** are distributed. Package identity, signing certificate, sessions and library data are retained. Release checks cover host tests, native UI/device smoke tests, lint, size, signature, alignment and both ARM package manifests. The signed ARM release binaries are not installed on the x86_64 test emulator. Physical-device frame timings, real Telegram accounts, Bluetooth and device-specific codecs require hardware validation; no universal frame-rate guarantee is implied. See **docs/reviews/UI-STABILITY-IMPLEMENTATION.ar.md** for the changes and validation limits. Baseline/Startup Profile generation remains a separate manual workflow.

          New uploads use your own private Telegram channels. The original application and its Saved Messages library remain unchanged. Select files again from their original sources to add them to Next. Telegram rate limits still apply.

          TeleDrive is the new display name of TG Drive Next (app.tgdrive.next). The existing package, signing certificate, sessions and local library are retained for updates. It continues to install alongside the original app.tgdrive application. A real Telegram account is not used in automated tests.
          NOTES
          gh release create "$tag" release-assets/* "${target_args[@]}" \
            --title "TeleDrive $version (build $GITHUB_RUN_NUMBER)" --notes-file release-notes.md --draft
          promoted=false
          for attempt in 1 2 3; do
            if gh release edit "$tag" --draft=false --latest; then
              latest="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" || latest=''
              if [[ "$latest" == "$tag" ]]; then promoted=true; break; fi
            fi
            sleep 3
          done
          [[ "$promoted" == true ]] || { echo '::error::Release assets were created, but latest-release promotion could not be verified.'; exit 1; }
          echo "### Installable APKs: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
