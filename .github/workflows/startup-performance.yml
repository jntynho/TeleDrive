name: Startup performance (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build isolated benchmark APKs and generate profiles, optionally compare frame timings'
        type: choice
        options: [generate, compare]
        default: generate
        required: true

permissions:
  contents: read

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual profiles and optional frame timings
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BENCHMARK_MODE: ${{ inputs.mode }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 2048M
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on
          script: bash scripts/run_startup_performance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-performance-reports
          path: |
            app/src/main/baseline-prof.txt
            app/src/main/startup-prof.txt
            startup-benchmark/build/outputs/connected_android_test_additional_output/
            startup-benchmark/build/reports/
          if-no-files-found: warn
