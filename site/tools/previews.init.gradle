// Opt-in fixture sources only; normal Android builds do not include website fixtures.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.named('compileDebugUnitTestKotlin').configure {
        source(app.fileTree(new File(gradle.rootProject.projectDir, 'site/tools/android-preview')) { include '**/*.kt' })
    }
}
